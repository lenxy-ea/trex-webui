# Managed by TRex WebUI deploy/install.sh.
[Service]
# Keep the distribution-owned main ruleset as the operator authority, but load
# it and the reserved TRex native-port table in one nft transaction. In
# particular, the reload transaction's global flush is never externally
# visible without the native-port reject rule.
ExecStart=
ExecStart=/usr/bin/bash /usr/libexec/trex-webui/trex_native_boundary.sh service-start /etc/sysconfig/nftables.conf
ExecReload=
ExecReload=/usr/bin/bash /usr/libexec/trex-webui/trex_native_boundary.sh service-reload /etc/sysconfig/nftables.conf
