server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name trex-webui.local;

    root /var/www/trex-webui/dist;
    index index.html;

    client_max_body_size 32m;
    server_tokens off;

    # Vite emits content-hashed JavaScript and CSS but does not currently ship
    # precompressed siblings. Compress eligible text assets dynamically today;
    # prefer a verified .gz sibling automatically when a future package supplies
    # one. API locations disable this explicitly so streaming/control responses
    # retain their existing transport behavior.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/javascript;

    # A TRex WebUI session can stop traffic, replace configuration, and control
    # the daemon. The packaged default is therefore loopback-only. Add explicit
    # management subnets as `allow` directives under access.d before reloading.
    allow 127.0.0.0/8;
    allow ::1;
    include /etc/nginx/trex-webui/access.d/*.conf;
    deny all;
    satisfy all;

    # Optional server-context controls such as auth_basic or TLS listeners live
    # here so the managed base file does not need local edits.
    include /etc/nginx/trex-webui/security.d/*.conf;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/trex-webui.access.log;
    error_log /var/log/nginx/trex-webui.error.log;

    location /api/trex/stats/stream {
        gzip off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        gzip off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
